name: Weekly Quarkus Tests

on:
  pull_request:
    paths:
      - '.github/workflows/quarkus.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  COMMON_MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end"
  DB_NAME: hibernate_orm_test
  DB_PASSWORD: hibernate_orm_test
  DB_USER: hibernate_orm_test
  NATIVE_TEST_MAVEN_ARGS: "-Dtest-containers -Dstart-containers -Dquarkus.native.native-image-xmx=6g -Dnative -Dnative.surefire.skip -Dformat.skip -Dno-descriptor-tests install -DskipDocs -Dquarkus.native.container-build=false"
  QUARKUS_JAVA_VERSION: 17 # Use Java 17 to build Quarkus as that's the lowest supported JDK version currently
  QUARKUS_PATH: ${{ github.workspace }}/quarkus

permissions: {}
jobs:
  build-quarkus-and-graalvm:
    permissions:
      contents: read # to fetch code (actions/checkout)

    name: Nightly Quarkus and GraalVM build
    runs-on: ubuntu-22.04
    if: (github.event_name == 'schedule' && github.repository == 'graalvm/graalvm-community-jdk25u') || (github.event_name != 'schedule')
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout oracle/graal
        uses: actions/checkout@v4

      # --- COMMENTED OUT LENGTHY GRAALVM BUILD ---
      # - name: Build GraalVM JDK
      #   uses: ./.github/actions/build-graalvm
      #   with:
      #     java-version: ${{ env.QUARKUS_JAVA_VERSION }}

      - name: Get latest Quarkus release
        run: |
          export QUARKUS_VERSION=main
          echo Getting Quarkus $QUARKUS_VERSION
          curl --output quarkus.tgz -sL https://api.github.com/repos/quarkusio/quarkus/tarball/$QUARKUS_VERSION
          mkdir ${QUARKUS_PATH}
          tar xf quarkus.tgz -C ${QUARKUS_PATH} --strip-components=1
          
          # --- COMMENTED OUT LENGTHY ARTIFACT TARRING & CACHING ---
          # - uses: actions/cache@v4
          #   with:
          #     path: ~/.m2/repository
          #     key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          #     restore-keys: |
          #       ${{ runner.os }}-maven-
          # - name: Tar GraalVM JDK
          #   shell: bash
          #   run: tar -czvhf graalvm.tgz -C $(dirname ${GRAALVM_HOME}) $(basename ${GRAALVM_HOME})
          # - name: Persist GraalVM JDK build
          #   uses: actions/upload-artifact@v4
          #   with:
          #     name: graalvm
          #     path: graalvm.tgz
          
          # --- COMMENTED OUT QUARKUS MAVEN BUILD ---
          # - name: Build Quarkus
          #   run: |
          #     cd ${QUARKUS_PATH}
          #     eval ./mvnw -e -B -Dquickly

      - name: Read json file with native-tests matrix
        id: read
        run: |
          json=$(tr -d '\n' < ${QUARKUS_PATH}/.github/native-tests.json )
          echo $json
          echo "matrix=${json}" >> $GITHUB_OUTPUT

    # --- COMMENTED OUT MAVEN REPO PERSISTENCE ---
    # - name: Tar Maven Repo
    #   shell: bash
    #   run: tar -czvf maven-repo.tgz -C ~ .m2/repository
    # - name: Persist Maven Repo
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: maven-repo
    #     path: maven-repo.tgz

  native-tests:
    name: Native Tests - ${{matrix.category}}
    needs: build-quarkus-and-graalvm
    runs-on: ubuntu-latest
    env:
      GRAALVM_HOME: ${{ github.workspace }}/graalvm
    timeout-minutes: ${{matrix.timeout}}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.build-quarkus-and-graalvm.outputs.matrix) }}
    steps:
      # --- COMMENTED OUT HEAVY TEST DEPENDENCIES ---
      # - name: Download GraalVM JDK build
      #   ...
      # - name: Extract GraalVM JDK build
      #   ...
      # - name: Get latest Quarkus release
      #   ...
      # - name: Reclaim Disk Space
      #   ...
      # - name: Download Maven Repo
      #   ...
      # - name: Extract Maven Repo
      #   ...

      - name: Setup Oracle JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Create Reproducer Source
        run: |
          cat << 'EOF' > Main.java
          import java.lang.management.ManagementFactory;
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Requesting PlatformMBeanServer...");
                  ManagementFactory.getPlatformMBeanServer();
                  System.out.println("Success! No NPE.");
              }
          }
          EOF

      - name: Reproducer - Oracle JDK 17 (EXPECT FAIL)
        run: |
          echo "=== Using Oracle JDK 17 ==="
          echo "JAVA_HOME is: $JAVA_HOME"
          $JAVA_HOME/bin/java -version
          $JAVA_HOME/bin/javac Main.java
          
          echo "=== Running Oracle JDK. Expecting a crash... ==="
          # We catch the failure so the workflow continues to the archiving step
          $JAVA_HOME/bin/java Main || echo "=== SUCCESSFUL REPRODUCTION: Oracle JDK crashed as expected. ==="

      - name: Archive Oracle JDK 17
        run: |
          echo "Archiving Oracle JDK from $JAVA_HOME"
          tar -czvf oracle-jdk-17.tar.gz -C $(dirname $JAVA_HOME) $(basename $JAVA_HOME)

      - name: Upload Oracle JDK Archive
        uses: actions/upload-artifact@v4
        with:
          # We append matrix.category to prevent artifacts from overwriting each other in parallel
          name: oracle-jdk-17-archive-${{matrix.category}}
          path: oracle-jdk-17.tar.gz

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Reproducer - Temurin JDK 17 (EXPECT PASS)
        run: |
          echo "=== Using Temurin JDK 17 ==="
          echo "JAVA_HOME is: $JAVA_HOME"
          $JAVA_HOME/bin/java -version
          
          echo "=== Running Temurin JDK. Expecting success... ==="
          # This should pass flawlessly
          $JAVA_HOME/bin/java Main

      # --- COMMENTED OUT NATIVE QUARKUS BUILDS ---
